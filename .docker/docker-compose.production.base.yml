services:

  winnery.space-rocket.frontend:
    image: winnery.space-rocket.frontend:${APP_VERSION:-v0.0.0}
    ports:
      - ${APP_EXTERNAL_PORT}:3000
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - NUXT_PUBLIC_SENTRY_DSN=$SENTRY_DSN
      - NUXT_PUBLIC_YANDEX_METRIKA_ID=$YANDEX_METRIKA_ID
      - NUXT_PUBLIC_GOOGLE_ANALYTICS_ID=$GOOGLE_ANALYTICS_ID
    security_opt:
      - seccomp:unconfined
    container_name: winnery.space-rocket.frontend
